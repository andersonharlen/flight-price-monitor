name: Flight Monitor Bot

on:
  schedule:
    # Roda a cada 1 hora (você pode ajustar conforme preferir)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub

jobs:
    run-monitor:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout do Código
          uses: actions/checkout@v4

        - name: Setup .NET SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0'

        - name: Executar Monitor de Voos
          env:
            EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
            EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          run: |
            dotnet run --project FlightMonitor.csproj
