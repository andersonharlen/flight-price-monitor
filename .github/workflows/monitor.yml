name: Flight Monitor Bot

on:
  schedule:
    # Roda a cada 6 horas (você pode alterar depois)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite que você clique em "Run" manualmente quando quiser

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Executar Verificação de Voos
        env:
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
        run: |
          dotnet run --project FlightMonitor.csproj
